name: Deploy

# Production deploys are deliberate: this workflow only runs when dispatched.
# The guard step fails with the reason when the app has no wrangler
# configuration, instead of deploying an empty workspace. Requires the
# repository secret CLOUDFLARE_API_TOKEN; CLOUDFLARE_ACCOUNT_ID is optional and
# only needed when that token can see more than one account.
#
# One Worker is the deploy target; a staging Worker needs `env.staging` in
# wrangler.jsonc and a build with CLOUDFLARE_ENV set.
on:
  workflow_dispatch:
    inputs:
      app:
        description: Workspace app under apps/ to deploy
        required: true
        default: web
        type: string

permissions:
  contents: read

concurrency:
  # One deploy per app at a time; a queued deploy waits rather than being
  # cancelled mid-upload.
  group: deploy-${{ inputs.app }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Require the Worker configuration
        run: |
          app="apps/${{ inputs.app }}"
          if [ ! -f "$app/wrangler.jsonc" ] && [ ! -f "$app/wrangler.toml" ] && [ ! -f "$app/wrangler.json" ]; then
            echo "::error::$app has no wrangler configuration. Scaffold the app with its wrangler.jsonc before deploying."
            exit 1
          fi

      - name: Check
        run: pnpm check

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # The account is derived from the token when it can see exactly one;
          # add CLOUDFLARE_ACCOUNT_ID only for a token that spans several.
          workingDirectory: apps/${{ inputs.app }}
          command: deploy
          packageManager: pnpm
