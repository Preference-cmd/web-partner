# pnpm workspace. One repository, several units:
#
#   apps/*       deployable Workers applications; each has its own
#                wrangler.jsonc and its own `build` / `deploy` scripts
#   packages/*   code shared by apps; never deployed on its own
#
# apps/web currently holds the layout shell; packages/ arrives when shared code
# is extracted. The root scripts use `--if-present` so an empty workspace is not
# a failure.
packages:
  - apps/*
  - packages/*

# pnpm runs dependency build scripts only for packages allowed here (v11+).
allowBuilds:
  esbuild: true
  workerd: true
  lefthook: true

# @napi-rs/wasm-runtime accepts runtime 2.0.0-beta, which breaks against
# @emnapi/core 1.11.3 (astro2tsx used by `astro check`). Pin the stable line.
overrides:
  "@emnapi/runtime": "1.11.3"
